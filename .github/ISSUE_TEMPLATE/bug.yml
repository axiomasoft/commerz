name: Bug report
description: Observed behaviour does not match the documented or expected one.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment (PHP, Laravel, database)
