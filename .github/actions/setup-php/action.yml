name: Set up PHP and Composer
description: Install PHP, restore the Composer download cache, and install the locked root. Packman must already be checked out beside the workspace.

inputs:
  php-version:
    description: PHP version to install
    default: "8.6"
  extensions:
    description: Comma-separated PHP extensions
    default: "dom, mbstring, pdo_pgsql, pcntl, bcmath, intl"
  coverage:
    description: Coverage driver
    default: none
  install:
    description: Run composer install for the root lockfile
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # stable PHP 8.6 (2026-11-20)
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        tools: composer:v2

    - name: Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('composer.lock', 'packages/*/composer.json') }}
        restore-keys: composer-${{ runner.os }}-php${{ inputs.php-version }}-

    - name: Install locked dependencies
      if: inputs.install == 'true'
      shell: bash
      run: composer install --prefer-dist --no-interaction --no-progress
