services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_DB: commerz_test
      POSTGRES_USER: commerz
      POSTGRES_PASSWORD: commerz
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerz -d commerz_test"]
      interval: 3s
      timeout: 3s
      retries: 20
